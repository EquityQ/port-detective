[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "port-detective"
version = "1.1.0.dev0"
description = "Lightweight Python SDK for port-detective: inspect ports, detect framework fingerprints, and clean project-scoped listeners."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "port-detective Maintainers" }
]
keywords = ["networking", "ports", "developer-tools", "process", "framework-detection", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/EquityQ/port-detective"
Repository = "https://github.com/EquityQ/port-detective"
Documentation = "https://github.com/EquityQ/port-detective/tree/master/python"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
