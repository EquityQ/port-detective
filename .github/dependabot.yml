version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: "/python"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/npm/port-detective"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
