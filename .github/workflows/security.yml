name: Dependency Security

on:
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "python/**"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "python/**"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-vulnerability-scan:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # govulncheck tracks the latest x/vuln release, which may require a
          # newer toolchain than the project's minimum supported Go version.
          go-version-input: "stable"
          go-package: "./..."

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools pip-audit pytest pytest-asyncio
          pip-audit --strict
