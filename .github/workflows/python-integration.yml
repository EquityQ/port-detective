name: Python SDK CLI Integration

on:
  push:
    branches: [main, master]
    paths:
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "main.go"
      - "python/**"
      - "scripts/integration/**"
      - ".github/workflows/python-integration.yml"
  pull_request:
    paths:
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "main.go"
      - "python/**"
      - "scripts/integration/**"
      - ".github/workflows/python-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install the SDK from the checkout
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .

      - name: Build the matching CLI
        shell: bash
        run: |
          output="port-detective"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            output="port-detective.exe"
          fi
          go build -o "$output" .
          echo "PORT_DETECTIVE_BIN=$GITHUB_WORKSPACE/$output" >> "$GITHUB_ENV"

      - name: Exercise the SDK against the CLI
        run: python scripts/integration/verify_python_cli.py
