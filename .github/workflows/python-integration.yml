name: Python SDK CLI Integration

on:
  push:
    branches: [main]
    paths:
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "main.go"
      - "python/**"
      - "scripts/integration/**"
      - ".github/workflows/python-integration.yml"
  pull_request:
    paths:
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "main.go"
      - "python/**"
      - "scripts/integration/**"
      - ".github/workflows/python-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25.x"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install the SDK from the checkout
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .

      - name: Build the matching CLI
        shell: bash
        run: |
          output="port-detective"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            output="port-detective.exe"
          fi
          go build -o "$output" .
          echo "PORT_DETECTIVE_BIN=$GITHUB_WORKSPACE/$output" >> "$GITHUB_ENV"

      - name: Exercise the SDK against the CLI
        run: python scripts/integration/verify_python_cli.py
