name: Python SDK

on:
  push:
    branches: [main, master]
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]

    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install test tools
        run: python -m pip install --upgrade pip pytest pytest-asyncio build

      - name: Run tests
        run: python -m pytest -q

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install wheel smoke test
        run: >-
          python -c "import glob, os, subprocess, sys, tempfile; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1, wheels; target = tempfile.mkdtemp(prefix='port-detective-smoke-'); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--quiet', '--target', target, wheels[0]]); env = os.environ.copy(); env['PYTHONPATH'] = target; subprocess.check_call([sys.executable, '-c', 'import port_detective; print(port_detective.__version__)'], cwd=target, env=env)"
