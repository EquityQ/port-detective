name: Python SDK

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "scripts/release/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - "scripts/release/**"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]

    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install test tools
        run: python -m pip install --upgrade pip pytest pytest-asyncio build "coverage>=7.6,<8"

      - name: Run tests
        run: python -m coverage run --branch --source=port_detective -m pytest -q

      - name: Enforce Python SDK coverage thresholds
        run: |
          python -m coverage report --include="port_detective/core.py" --fail-under=60
          python -m coverage report --include="port_detective/models.py" --fail-under=85
          python -m coverage report --fail-under=65
          python -m coverage html -d coverage/html
          python -m coverage xml -o coverage/coverage.xml

      - name: Publish Python coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-report
          path: python/coverage/
          if-no-files-found: warn

      - name: Test release artifact validators
        working-directory: .
        run: python -m unittest discover -s scripts/release -p "test_*.py" -v

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install wheel smoke test
        run: >-
          python -c "import glob, os, subprocess, sys, tempfile; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1, wheels; target = tempfile.mkdtemp(prefix='port-detective-smoke-'); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--quiet', '--target', target, wheels[0]]); env = os.environ.copy(); env['PYTHONPATH'] = target; subprocess.check_call([sys.executable, '-c', 'import port_detective; print(port_detective.__version__)'], cwd=target, env=env)"
