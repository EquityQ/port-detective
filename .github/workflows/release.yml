name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/port-detective
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.x'
          cache: true

      - name: Verify Go dependencies
        run: go mod verify

      - name: Run Go quality gates
        shell: bash
        run: |
          go build ./...
          go test -race ./...
          go vet ./...
          test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Prepare matching Python release version
        shell: bash
        run: python scripts/release/prepare_python_release.py --root python --version "${GITHUB_REF_NAME#v}"

      - name: Validate Python SDK
        working-directory: python
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio build
          python -m pytest -q
          python -m build

      - name: Build release candidate for MCP acceptance
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          go build -ldflags "-s -w -X github.com/EquityQ/port-detective/internal/version.Value=${release_version}" -o port-detective ./
          python scripts/release/verify_artifacts.py \
            --expected-version "${release_version}" \
            --cli ./port-detective \
            --python-root python \
            --wheel-dir python/dist

      - name: Run MCP acceptance checks
        shell: bash
        env:
          PORT_DETECTIVE_BIN: ${{ github.workspace }}/port-detective
        run: |
          python scripts/mcp/verify_handshake.py
          python scripts/mcp/verify_tools.py
          python scripts/mcp/verify_stdout_purity.py

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@90a3faa9d0182683851fbfa97ca1a2cb983bfca3 # v6.2.1
        with:
          distribution: goreleaser
          version: v2.6.1
          args: check

      - name: Build release artifacts without publishing
        uses: goreleaser/goreleaser-action@90a3faa9d0182683851fbfa97ca1a2cb983bfca3 # v6.2.1
        with:
          distribution: goreleaser
          version: v2.6.1
          args: release --clean --skip=publish

      - name: Verify release archives and checksums
        shell: bash
        run: |
          python scripts/release/verify_artifacts.py \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --dist dist \
            --checksums dist/checksums.txt

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
        with:
          path: .
          format: spdx-json
          output-file: port-detective_${{ github.ref_name }}.spdx.json
          upload-artifact: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@053f9b74638557590800a301da1ba82351507e2c # v3.8.1

      - name: Sign release artifacts and SBOM
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/*.tar.gz dist/*.zip dist/checksums.txt python/dist/*.whl python/dist/*.tar.gz "port-detective_${GITHUB_REF_NAME}.spdx.json")
          test "${#artifacts[@]}" -gt 0
          for artifact in "${artifacts[@]}"; do
            cosign sign-blob --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem" \
              "${artifact}"
          done

      - name: Verify Cosign signatures
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/*.tar.gz dist/*.zip dist/checksums.txt python/dist/*.whl python/dist/*.tar.gz "port-detective_${GITHUB_REF_NAME}.spdx.json")
          test "${#artifacts[@]}" -gt 0
          for artifact in "${artifacts[@]}"; do
            cosign verify-blob \
              --certificate "${artifact}.pem" \
              --signature "${artifact}.sig" \
              --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/.+" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${artifact}"
          done

      - name: Attest Go release artifacts
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: dist/**

      - name: Attest Python distributions
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: python/dist/*

      - name: Attest SBOM
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: port-detective_${{ github.ref_name }}.spdx.json

      - name: Stage Python distributions for PyPI
        shell: bash
        run: |
          mkdir pypi-dist
          cp python/dist/*.whl python/dist/*.tar.gz pypi-dist/

      - name: Publish Python distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7f25271a4aa483500f742f9492b2ab5648d61011 # v1.12.4
        with:
          packages-dir: pypi-dist
          skip-existing: true

      - name: Verify the published PyPI package
        shell: bash
        run: |
          python scripts/release/verify_pypi_install.py \
            --version "${GITHUB_REF_NAME#v}" \
            --cli ./port-detective

      - name: Publish verified GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip dist/checksums.txt python/dist/*.whl python/dist/*.tar.gz dist/*.sig dist/*.pem python/dist/*.sig python/dist/*.pem "port-detective_${GITHUB_REF_NAME}.spdx.json")
          assets+=("port-detective_${GITHUB_REF_NAME}.spdx.json.sig" "port-detective_${GITHUB_REF_NAME}.spdx.json.pem")
          test "${#assets[@]}" -gt 0
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag \
            --title "port-detective ${GITHUB_REF_NAME}" \
            --generate-notes

  dispatch_npm:
    name: Dispatch npm publication
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch npm publication workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run npm-publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f tag="$GITHUB_REF_NAME"
