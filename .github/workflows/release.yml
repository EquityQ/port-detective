name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Verify Go dependencies
        run: go mod verify

      - name: Run Go quality gates
        shell: bash
        run: |
          go build ./...
          go test -race ./...
          go vet ./...
          test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate Python SDK
        working-directory: python
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio build
          python -m pytest -q
          python -m build

      - name: Build release candidate for MCP acceptance
        shell: bash
        run: go build -o port-detective ./

      - name: Run MCP acceptance checks
        shell: bash
        env:
          PORT_DETECTIVE_BIN: ${{ github.workspace }}/port-detective
        run: |
          python scripts/mcp/verify_handshake.py
          python scripts/mcp/verify_tools.py
          python scripts/mcp/verify_stdout_purity.py

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.6.1
          args: check

      - name: Build and publish release artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.6.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
