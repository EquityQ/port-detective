name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Verify Go dependencies
        run: go mod verify

      - name: Run Go quality gates
        shell: bash
        run: |
          go build ./...
          go test -race ./...
          go vet ./...
          test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare matching Python release version
        shell: bash
        run: python scripts/release/prepare_python_release.py --root python --version "${GITHUB_REF_NAME#v}"

      - name: Validate Python SDK
        working-directory: python
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio build
          python -m pytest -q
          python -m build

      - name: Build release candidate for MCP acceptance
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          go build -ldflags "-s -w -X github.com/EquityQ/port-detective/internal/version.Value=${release_version}" -o port-detective ./
          python scripts/release/verify_artifacts.py \
            --expected-version "${release_version}" \
            --cli ./port-detective \
            --python-root python \
            --wheel-dir python/dist

      - name: Run MCP acceptance checks
        shell: bash
        env:
          PORT_DETECTIVE_BIN: ${{ github.workspace }}/port-detective
        run: |
          python scripts/mcp/verify_handshake.py
          python scripts/mcp/verify_tools.py
          python scripts/mcp/verify_stdout_purity.py

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.6.1
          args: check

      - name: Build and publish release artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.6.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release archives and checksums
        shell: bash
        run: |
          python scripts/release/verify_artifacts.py \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --dist dist \
            --checksums dist/checksums.txt

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: port-detective_${{ github.ref_name }}.spdx.json
          upload-artifact: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts and SBOM
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/*.tar.gz dist/*.zip dist/checksums.txt python/dist/*.whl python/dist/*.tar.gz "port-detective_${GITHUB_REF_NAME}.spdx.json")
          test "${#artifacts[@]}" -gt 0
          for artifact in "${artifacts[@]}"; do
            cosign sign-blob --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem" \
              "${artifact}"
          done

      - name: Attest Go release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/**

      - name: Attest Python distributions
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: python/dist/*

      - name: Attest SBOM
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: port-detective_${{ github.ref_name }}.spdx.json

      - name: Upload Python distributions, SBOM, and signatures
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(python/dist/*.whl python/dist/*.tar.gz dist/*.sig dist/*.pem python/dist/*.sig python/dist/*.pem "port-detective_${GITHUB_REF_NAME}.spdx.json")
          assets+=("port-detective_${GITHUB_REF_NAME}.spdx.json.sig" "port-detective_${GITHUB_REF_NAME}.spdx.json.pem")
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
