name: Compatibility report / 兼容性报告
description: Report reproducible OS, architecture, runtime, or permission differences.
title: "compat: "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: |
        Search existing reports first. Remove credentials, personal command lines, and private paths.
        请先搜索已有报告，并删除凭据、个人命令行和私有路径。
  - type: input
    id: cli-version
    attributes:
      label: CLI version or commit / CLI 版本或提交
      placeholder: 1.1.0-dev or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, version, and architecture / 操作系统、版本和架构
      placeholder: Windows 11 amd64
    validations:
      required: true
  - type: textarea
    id: runtimes
    attributes:
      label: Runtime and execution environment / 运行时和执行环境
      description: Go/Python/Node.js versions, shell, permission level, WSL/container/VM/VPN.
      placeholder: Go 1.25, PowerShell, standard user, no container
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction / 复现步骤
      description: Include exact commands and sanitized output. State whether the listener is IPv4 or IPv6.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual results / 预期与实际结果
    validations:
      required: true
